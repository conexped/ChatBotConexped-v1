version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hi
      - hello
      - hey
      - good morning
      - good evening

  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - see you later
      - have a nice day

  - intent: affirm
    examples: |
      - yes
      - indeed
      - correct
      - that's right

  - intent: deny
    examples: |
      - no
      - not at all
      - that's not correct

  - intent: mood_great
    examples: |
      - I am feeling great
      - I am doing well
      - I feel awesome

  - intent: mood_unhappy
    examples: |
      - I am feeling sad
      - I am not doing well
      - I feel bad

  - intent: bot_challenge
    examples: |
      - are you a bot?
      - what is your name?
      - who created you?

  - intent: ask_help
    examples: |
      - I need help
      - Can you assist me?
      - I need assistance